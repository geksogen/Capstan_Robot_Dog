controller_manager:
  ros__parameters:
    update_rate: 200  # Соответствует частоте 5мс (200Гц) из прошивки ESP32

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    position_controller:
      type: position_controllers/JointGroupPositionController

position_controller:
  ros__parameters:
    joints:
      - joint_abad
      - joint_a
      - joint_b
    interface_name: position
